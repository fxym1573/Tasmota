name: Build Tasmota

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build Tasmota Lite
        run: pio run -e tasmota-lite

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-lite
          path: .pio/build/tasmota-lite/firmware.bin
